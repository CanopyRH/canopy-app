[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = []
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Stated, not left to the default, so the metadata hash in the deployed bytecode stays the same across Foundry versions.
bytecode_hash = "ipfs"
cbor_metadata = true

[fuzz]
runs = 256

# Stateful invariant run: at least 100,000 calls (512 runs x 256 calls). Use:
#   FOUNDRY_PROFILE=invariant forge test --match-path test/RouterInvariant.t.sol
# The default profile runs only a short smoke pass of the same suite (forge-config line in the test file).
# This adds a profile and changes nothing about how contracts are compiled.
[profile.invariant.invariant]
runs = 512
depth = 256
fail_on_revert = false
show_metrics = true

# Symbolic checks for halmos (test/review/RouterSymbolic.t.sol, the `check_` functions; forge only compiles them).
# halmos needs shanghai bytecode, and real `new` creations in tests rather than forge's dynamic test linking (which
# turns them into a deployCode cheatcode halmos doesn't support). Contracts compile as in the default profile otherwise:
#   FOUNDRY_PROFILE=halmos halmos --root contracts --match-contract RouterSymbolic
[profile.halmos]
evm_version = "shanghai"
dynamic_test_linking = false
