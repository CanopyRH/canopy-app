[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = []
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Stated, not left to the default, so the metadata hash in the deployed bytecode stays the same across Foundry versions.
bytecode_hash = "ipfs"
cbor_metadata = true

[fuzz]
runs = 256
