name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_SOLC: 0.8.28
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: canopy
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U canopy" --health-interval 5s --health-retries 10
    steps:
      # Actions are pinned to a commit, so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads the whole history
      - name: No secrets in the history
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --no-banner . && rm gitleaks
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: forge build && forge test
        working-directory: contracts
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile && bun ../tools/export-abi.ts && bun test && bunx tsc --noEmit
        working-directory: services
      - run: bun test
        working-directory: services
        env:
          TEST_DATABASE_URL: postgres://canopy@127.0.0.1:5432/postgres
      - run: bun test && bunx tsc --noEmit
        working-directory: web
      - run: bun tools/banned-words.ts
      - name: The service image starts
        run: |
          docker build -t canopy-services services
          docker run -d --name api --network host -e ROLE=api -e ALERTS_ONLY=true -e CHAIN_ID=4663 \
            -e PUBLIC_URL=https://canopy.invalid -e DATABASE_URL=postgres://canopy@127.0.0.1:5432/postgres \
            -e RPC_URL=https://rpc.mainnet.chain.robinhood.com -e RPC_URL_BACKUP=https://robinhood.drpc.org \
            -e TELEGRAM_BOT_TOKEN=0:ci -e TELEGRAM_WEBHOOK_SECRET=ci-only-webhook-secret canopy-services
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8443/vaults && exit 0; sleep 1; done
          docker logs api
          exit 1
      - name: The web build is repeatable
        run: test "$(tools/build-web.sh 2>/dev/null)" = "$(tools/build-web.sh 2>/dev/null)"
  slither:
    # Static analysis of the contracts. Findings of medium or higher fail the job unless they are triaged, with a
    # reason each, in contracts/slither.db.json. The settings live in contracts/slither.config.json.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOUNDRY_SOLC: 0.8.28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.3
      - run: slither .
        working-directory: contracts
  invariants:
    # The stateful invariant suite for ExitRouter: 512 runs of 256 calls, about a minute. See contracts/INVARIANTS.md.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FOUNDRY_SOLC: 0.8.28
      FOUNDRY_PROFILE: invariant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - run: forge test --match-path test/RouterInvariant.t.sol
        working-directory: contracts
