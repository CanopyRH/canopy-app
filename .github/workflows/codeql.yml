name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  analyze:
    # Code scanning results upload only to the public repo.
    if: github.repository == 'CanopyRH/canopy-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload the results
    steps:
      # Actions are pinned to a commit, so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
          # The services and the web app are TypeScript, so there is nothing to build.
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
